[project]
name = "x402-warranty"
version = "0.1.0"
description = "x402 Warranty proxy for PayBox hackathon"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "web3>=7.0.0",
    "x402[fastapi,httpx]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["server"]
